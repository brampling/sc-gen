apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-service-src
  namespace: sc-test
data:
  server.js: |
    const http = require('http');

    const PORT = 8080;

    function log(level, message, extra) {
      process.stdout.write(JSON.stringify({
        level,
        message,
        ...extra,
        ts: new Date().toISOString(),
      }) + '\n');
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    // Downstream call to ourselves, so /checkout produces a multi-span trace
    // (server span -> client span -> server span). Useful for verifying that a
    // sampling decision applies to the whole trace, not a single span.
    function callInventory(sku) {
      return new Promise((resolve, reject) => {
        const req = http.request(
          { host: '127.0.0.1', port: PORT, path: `/inventory?sku=${sku}`, method: 'GET' },
          (res) => {
            res.resume();
            res.on('end', () => resolve(res.statusCode));
          },
        );
        req.on('error', reject);
        req.end();
      });
    }

    const SKUS = ['sku-1001', 'sku-1002', 'sku-1003', 'sku-1004'];
    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

    const server = http.createServer(async (req, res) => {
      const url = new URL(req.url, `http://${req.headers.host}`);
      const path = url.pathname;

      try {
        if (path === '/health') {
          // High-volume, low-value telemetry: the spam-filter target.
          log('debug', 'healthcheck probe served', { endpoint: '/health', noise: true });
          res.writeHead(200, { 'content-type': 'application/json' });
          res.end('{"status":"ok"}');
          return;
        }

        if (path === '/inventory') {
          await sleep(20 + Math.random() * 40);
          res.writeHead(200, { 'content-type': 'application/json' });
          res.end(JSON.stringify({ sku: url.searchParams.get('sku'), inStock: true }));
          return;
        }

        if (path === '/checkout') {
          const sku = pick(SKUS);
          await callInventory(sku);
          await sleep(30 + Math.random() * 120);

          // ~12% of checkouts fail, giving the error-based sampling rule
          // something to keep and the RED metrics a non-zero error rate.
          if (Math.random() < 0.12) {
            log('error', 'checkout failed: payment declined', { endpoint: '/checkout', sku });
            res.writeHead(500, { 'content-type': 'application/json' });
            res.end('{"error":"payment_declined"}');
            return;
          }

          log('info', 'checkout completed', { endpoint: '/checkout', sku });
          res.writeHead(200, { 'content-type': 'application/json' });
          res.end(JSON.stringify({ orderId: `ord-${Math.floor(Math.random() * 1e6)}`, sku }));
          return;
        }

        if (path === '/search') {
          await sleep(10 + Math.random() * 60);
          log('info', 'search executed', { endpoint: '/search', q: url.searchParams.get('q') });
          res.writeHead(200, { 'content-type': 'application/json' });
          res.end('{"results":[]}');
          return;
        }

        // High-cardinality path: /orders/<uuid-ish id>
        if (path.startsWith('/orders/')) {
          await sleep(15 + Math.random() * 50);
          res.writeHead(200, { 'content-type': 'application/json' });
          res.end(JSON.stringify({ orderId: path.slice('/orders/'.length), status: 'shipped' }));
          return;
        }

        res.writeHead(404, { 'content-type': 'application/json' });
        res.end('{"error":"not_found"}');
      } catch (err) {
        log('error', `unhandled error: ${err.message}`, { endpoint: path });
        res.writeHead(500);
        res.end('{"error":"internal"}');
      }
    });

    server.listen(PORT, () => log('info', `checkout-service listening on ${PORT}`, {}));
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
  namespace: sc-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-service
  template:
    metadata:
      labels:
        app: checkout-service
    spec:
      containers:
        - name: checkout-service
          image: node:22-alpine
          command: ["node", "/app/server.js"]
          env:
            # The operator injects the collector endpoint and protocol but not a
            # service name, so the Node SDK falls back to its own default and
            # every span, log and RED metric arrives as
            # service.name="unknown_service:node". Set it explicitly.
            - name: OTEL_SERVICE_NAME
              value: checkout-service
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: src
              mountPath: /app
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
      volumes:
        - name: src
          configMap:
            name: checkout-service-src
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-service
  namespace: sc-test
spec:
  selector:
    app: checkout-service
  ports:
    - port: 8080
      targetPort: 8080
